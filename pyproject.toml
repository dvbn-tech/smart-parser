[project]
name = "smart-parser"
version = "0.1.0"
description = "Instagram Reels parser, brand creator discovery and spike detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "aioboto3>=13.1",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "typer>=0.12",
]

[project.scripts]
smart-parser = "parser.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-aioboto3[s3]>=13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "parser"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["core", "parser"]

[[tool.mypy.overrides]]
module = ["arq.*", "aioboto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["integration: needs docker compose services"]

[tool.coverage.run]
source = ["core", "parser"]

[tool.ruff.lint.per-file-ignores]
"infra/migrations/versions/*" = ["E501"]
